<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YPG Madina | Follow the Movement</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ypg-blue: #002395;
            --ypg-gold: #FFD700;
            --bg-light: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, var(--ypg-blue) 0%, #001a6b 300px, var(--bg-light) 300px);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .profile-card {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .logo-container {
            width: 100px;
            height: 100px;
            background: white;
            margin: -80px auto 15px;
            border-radius: 50%;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .logo-container img {
            width: 100%;
            height: auto;
        }

        h1 { font-size: 1.5rem; color: var(--ypg-blue); margin: 10px 0 5px; }
        p.motto { font-style: italic; color: #555; font-size: 0.9rem; margin-bottom: 25px; }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-link {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 2px solid #eee;
            color: #333;
        }

        .social-link:hover {
            border-color: var(--ypg-gold);
            background-color: #fffdf0;
            transform: scale(1.02);
        }

        .social-link i {
            font-size: 1.3rem;
            width: 35px;
            text-align: center;
            margin-right: 10px;
        }

        /* Branding Colors */
        .tiktok-icon { color: #000; }
        .instagram-icon { color: #E1306C; }
        .snapchat-icon { color: #FFFC00; text-shadow: 0 0 1px #000; }
        .whatsapp-icon { color: #25D366; }

        .footer-text {
            margin-top: 30px;
            font-weight: bold;
            color: var(--ypg-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="logo-container">
            <img src="logo.png" alt="YPG Logo">
        </div>

        <h1>FAITH YPG MADINA ESTATES</h1>
        <p class="motto">"To Know His Will and To Do It"</p>

        <div class="links-container">
            <a href="https://www.tiktok.com/@faithypg_madina" class="social-link" target="_blank">
                <i class="fab fa-tiktok tiktok-icon"></i> TikTok
            </a>

            <a href="https://www.instagram.com/faithypg_madina" class="social-link" target="_blank">
                <i class="fab fa-instagram instagram-icon"></i> Instagram
            </a>

            <a href="https://www.snapchat.com/add/faithypg_madina" class="social-link" target="_blank">
                <i class="fab fa-snapchat snapchat-icon"></i> Snapchat
            </a>

            <a href="https://chat.whatsapp.com/JVV9eL1RCQeAh75ul1WIzK" class="social-link" target="_blank">
                <i class="fab fa-whatsapp whatsapp-icon"></i> Join WhatsApp Group
            </a>
        </div>

        <p class="footer-text">SERVICE ALL THE WAY!</p>
    </div>

</body>
</html>
